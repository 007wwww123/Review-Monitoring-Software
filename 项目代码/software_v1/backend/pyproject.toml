[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-review-detection-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "PyJWT>=2.8,<3.0",
  "pydantic>=2.5,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pymysql>=1.1,<2.0",
  "aiomysql>=0.2,<1.0",
  "torch>=2.3,<=2.7.1",
  "transformers>=4.42,<5",
  "sentencepiece>=0.2,<1",
  "protobuf>=4.25,<6",
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
