services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        PYTORCH_BASE_IMAGE: ${PYTORCH_BASE_IMAGE}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ../configs:/app/configs:ro
      - ${MODEL_HOST_DIR}:/app/models:ro
      - ${DATASET_HOST_DIR}:/controlled/datasets:ro
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        PYTORCH_BASE_IMAGE: ${PYTORCH_BASE_IMAGE}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ../configs:/app/configs:ro
      - ${MODEL_HOST_DIR}:/app/models:ro
      - ${DATASET_HOST_DIR}:/controlled/datasets:ro
    depends_on:
      - backend
    command: ["python", "/app/scripts/run_worker.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
