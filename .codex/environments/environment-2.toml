# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "虚假评论检测系统开发"

[setup]
script = '''
# 切入项目根目录
cd $env:CODEX_WORKTREE_PATH

# 1. 升级pip，规避安装报错
python -m pip install --upgrade pip -i https://pypi.tuna.tsinghua.edu.cn/simple

# 2. 优先安装PyTorch（必须最先安装，保证和后续库版本兼容）
# 有NVIDIA显卡GPU版本（CUDA12.1，主流通用）
python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121

# 无独立显卡 请注释上面一行，启用下面CPU版本
# python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

# 3. 安装NLP、数据处理、后端框架核心依赖
python -m pip install transformers pandas fastapi uvicorn -i https://pypi.tuna.tsinghua.edu.cn/simple

# 4. 批量导入requirements.txt里其余自定义依赖
python -m pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

# 前端pnpm依赖（无网页可视化界面直接删除这两行）
pnpm config set registry https://registry.npmmirror.com
pnpm install
'''

[cleanup]
script = '''
# 未使用Docker容器，直接删掉第一行docker命令
docker compose down --remove-orphans

# 删除项目临时缓存文件
if(Test-Path .cache\tmp){
    Remove-Item -Recurse -Force .cache\tmp
}

# 清空pip下载缓存，释放磁盘空间
python -m pip cache purge
'''
